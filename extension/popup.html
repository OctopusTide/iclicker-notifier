<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>iClicker Alerts</title>
    <link rel="stylesheet" href="popup.css">
    <script src="settings.js" defer></script>
    <script src="i18n.js" defer></script>
    <script src="popup.js" defer></script>
  </head>
  <body>
    <main>
      <header class="app-header">
        <div class="app-mark" aria-hidden="true">iC</div>
        <div class="heading"><h1>iClicker</h1><p data-i18n="tagline">Classroom alerts</p></div>
        <label class="language-control"><span class="sr-only">中文 / EN</span><select id="language" aria-label="中文 / EN" disabled><option value="auto" data-i18n="languageAuto">Auto</option><option value="zh-CN">中文</option><option value="en">English</option></select></label>
        <label class="switch master-switch" data-i18n-title="enabled">
          <input id="enabled" type="checkbox" data-i18n-aria="enabled" aria-label="Enable alerts" disabled>
          <span class="switch-track" aria-hidden="true"></span>
        </label>
      </header>

      <section class="status-card" data-i18n-aria="monitorStatus" aria-label="Monitor status">
        <span class="status-dot" id="status-dot" aria-hidden="true"></span>
        <div><p class="status-title" id="status-title">Connecting…</p><p class="status-detail" id="status-detail">Keep your course page open.</p></div>
      </section>

      <form id="settings-form">
        <fieldset disabled id="controls">
          <legend data-i18n="when">When to alert</legend>
          <label class="setting-row" for="class-started"><span data-i18n="classStarted">Class starts</span><span class="switch"><input id="class-started" type="checkbox"><span class="switch-track" aria-hidden="true"></span></span></label>
          <label class="setting-row" for="question-opened"><span data-i18n="questionOpened">New question</span><span class="switch"><input id="question-opened" type="checkbox"><span class="switch-track" aria-hidden="true"></span></span></label>

          <div class="section-rule"></div>
          <h2 data-i18n="how">How to alert</h2>
          <label class="setting-row" for="desktop"><span data-i18n="desktop">Desktop notification</span><span class="switch"><input id="desktop" type="checkbox"><span class="switch-track" aria-hidden="true"></span></span></label>
          <label class="setting-row" for="sound"><span data-i18n="sound">Sound</span><span class="switch"><input id="sound" type="checkbox"><span class="switch-track" aria-hidden="true"></span></span></label>
          <div class="sound-options" id="sound-options">
            <div class="tone-row"><label for="tone" data-i18n="tone">Tone</label><select id="tone"><option value="chime" data-i18n="chime">Soft chime</option><option value="bell" data-i18n="bell">Clear bell</option><option value="pulse" data-i18n="pulse">Short pulse</option></select></div>
            <div class="volume-row"><label for="volume" data-i18n="volume">Volume</label><input id="volume" type="range" min="0" max="100" step="5" value="65" aria-describedby="volume-hint"><output for="volume" id="volume-label">65%</output></div>
            <p class="small-note" id="volume-hint" data-i18n="audioHint">Uses your current audio output.</p>
          </div>
        </fieldset>
      </form>

      <div class="actions"><button id="test-alert" class="primary" type="button" disabled data-i18n="test">Test alert</button><button id="open-iclicker" class="secondary" type="button" data-i18n="open">Open iClicker ↗</button></div>
      <p class="feedback" id="feedback" role="status" aria-live="polite"></p>
      <p class="error" id="error" role="alert" hidden></p>
      <footer><p data-i18n="footer">Keep your course tab open and computer awake.</p><p id="last-alert" class="last-alert" hidden></p></footer>
    </main>
  </body>
</html>
